<app-header></app-header>

<ion-content id="main-content" class="ion-padding">
  <div class="login-container">
    <h1 class="login-title">Login</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <ion-list>
        <ion-item>
          <ion-label position="stacked">User</ion-label>
          <ion-input type="text" formControlName="username" placeholder="User"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Password</ion-label>
          <ion-input type="password" formControlName="password" placeholder="Password"></ion-input>
        </ion-item>
      </ion-list>

      @if (errorMessage) {
        <ion-text color="danger" class="ion-text-center">
          <p>{{ errorMessage }}</p>
        </ion-text>
      }

      <div class="ion-text-center ion-margin-top">
        <ion-button type="submit" color="primary" expand="block">Login</ion-button>
      </div>

      <div class="helper-links ion-text-center ion-margin-top">
        <p><a routerLink="/forgot-your-password">Forgot your password?</a></p>
        <p><a routerLink="/create-an-account">Register</a></p>
      </div>
    </form>
  </div>
</ion-content>

<app-footer></app-footer>
