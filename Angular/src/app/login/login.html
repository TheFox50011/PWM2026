<body>
<app-header></app-header>

<main class="login-container">
  <h1 class="login-title">Login</h1>

  <form class="form-wrapper" onsubmit="handleLogin(event)">

    <div class="input-group">
      <p class="label">User:</p>
      <input type="text" id="login-username" class="main-input" placeholder="User" required>
    </div>

    <div class="input-group">
      <p class="label">Password:</p>
      <input type="password" id="login-password" class="main-input" placeholder="Password" required>
    </div>

    <div class="button-container">
      <button type="submit" class="login-btn">Login</button>
    </div>

    <div class="helper-links">
      <p><a href="ForgotYourPassword.html">Forgot your password?</a></p>
      <p><a href="CreateAnAccount.html">Register</a></p>
    </div>

  </form>

</main>
<app-footer></app-footer>
