<app-header></app-header>

<div class="layout-container">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <h1 class="page-title">Create Test</h1>

    <div class="test-form-wrapper">
      <div class="left-column">
        <label class="input-label">Test name</label>
        <input type="text" [(ngModel)]="testName" class="input-title" placeholder="Enter test name…">

        <div class="question-card" *ngIf="questions && questions.length > 0 && questions[currentQuestionIndex]">
          <label class="card-label">Question {{ currentQuestionIndex + 1 }}</label>
          <input type="text" [(ngModel)]="questions[currentQuestionIndex].questionText"
                 class="input-pill" placeholder="Write your question here…">

          <label class="card-label">
            Options
            <span class="hint">&nbsp;— click ○ to mark the correct answer</span>
          </label>

          <div class="option-row" *ngFor="let opt of questions[currentQuestionIndex].options; let i = index">
            <!-- Correct-answer toggle -->
            <button class="correct-btn"
                    [class.is-correct]="opt.isCorrect"
                    (click)="toggleCorrect(i)"
                    [title]="opt.isCorrect ? 'Correct answer' : 'Mark as correct'">
              {{ opt.isCorrect ? '✓' : '○' }}
            </button>

            <input type="text" [(ngModel)]="opt.text"
                   class="input-pill"
                   [placeholder]="optionPlaceholder(i)">

            <!-- Remove option (only when > 2 options) -->
            <button class="remove-option-btn"
                    *ngIf="questions[currentQuestionIndex].options.length > 2"
                    (click)="removeOption(i)"
                    title="Remove option">✕</button>
          </div>

          <div class="add-text-btn" (click)="addOption()">
            <strong class="plus-symbol">+</strong>
            <span>Add option</span>
          </div>
        </div>
      </div>

      <!-- RIGHT: question list -->
      <div class="right-column">
        <div class="options-card">
          <label class="card-label">Questions</label>

          <div class="question-item"
               *ngFor="let q of questions; let idx = index"
               (click)="selectQuestion(idx)"
               [class.active-q]="idx === currentQuestionIndex"
               [class.q-done]="isQuestionComplete(idx)">
            <span>
              <span *ngIf="isQuestionComplete(idx)" class="q-check">✓ </span>
              Question {{ idx + 1 }}
            </span>
            <button class="remove-question-btn"
                    *ngIf="questions.length > 1"
                    (click)="removeQuestion(idx, $event)"
                    title="Delete question">✕</button>
          </div>

          <div class="sidebar-add-btn" (click)="addQuestion()">
            <span>Add question</span>
            <strong>+</strong>
          </div>
        </div>

        <button class="create-btn" (click)="createTest()">Create Test</button>
      </div>
    </div>
  </main>
</div>

<app-footer></app-footer>
