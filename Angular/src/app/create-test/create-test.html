 <app-header></app-header>

  <div class="layout-container">

    <app-sidebar></app-sidebar>

  <!-- MAIN -->
  <main class="main-content">

    <h1 class="page-title">Create Test</h1>

    <div class="test-form-wrapper">

      <!-- LEFT: test name + question editor -->
      <div class="left-column">
        <label class="input-label">Test name</label>
        <input type="text" class="input-title" placeholder="Enter test name…">

        <div class="question-card">
          <label class="card-label">Question</label>
          <input type="text" class="input-pill" placeholder="Write your question here…">

          <label class="card-label">Options</label>

          <div class="option-row">
            <span class="circle-bullet"></span>
            <input type="text" class="input-pill" placeholder="Option A">
            <span class="icon-btn" title="Mark correct" onclick="toggleCorrect(this)">&#9744;</span>
          </div>

          <div class="option-row">
            <span class="circle-bullet"></span>
            <input type="text" class="input-pill" placeholder="Option B">
            <span class="icon-btn" title="Mark correct" onclick="toggleCorrect(this)">&#9744;</span>
          </div>

          <div class="add-text-btn" onclick="addOption()">
            <strong class="plus-symbol">+</strong>
            <span>Add option</span>
          </div>
        </div>
      </div>

      <!-- RIGHT: questions list + create -->
      <div class="right-column">
        <label class="input-label">Questions</label>

        <div class="options-card" id="questions-panel">
          <div class="question-item">
            <span>Question 1</span>
            <div class="question-actions">
              <span class="action-icon" title="Delete">&#128465;</span>
            </div>
          </div>

          <div class="sidebar-add-btn" onclick="addQuestion()">
            <span>Add question</span>
            <strong class="plus-symbol-dark">+</strong>
          </div>
        </div>

        <div class="create-btn-row">
          <button class="create-btn" onclick="createTest()">Create</button>
        </div>
      </div>

    </div>
  </main>

</div>

<script>
  let questionCount = 1;

  function toggleCorrect(el) {
    el.innerHTML = el.innerHTML.trim() === '&#9744;' || el.textContent === '☐'
      ? '&#9745;'
      : '&#9744;';
  }

  function addOption() {
    const card = document.querySelector('.question-card');
    const addBtn = card.querySelector('.add-text-btn');
    const row = document.createElement('div');
    row.className = 'option-row';
    row.innerHTML = `
        <span class="circle-bullet"></span>
        <input type="text" class="input-pill" placeholder="New option">
        <span class="icon-btn" title="Mark correct" onclick="toggleCorrect(this)">&#9744;</span>
      `;
    card.insertBefore(row, addBtn);
  }

  function addQuestion() {
    questionCount++;
    const panel = document.getElementById('questions-panel');
    const addBtn = panel.querySelector('.sidebar-add-btn');
    const item = document.createElement('div');
    item.className = 'question-item';
    item.innerHTML = `
        <span>Question ${questionCount}</span>
        <div class="question-actions">
          <span class="action-icon" title="Delete" onclick="this.closest('.question-item').remove()">&#128465;</span>
        </div>
      `;
    panel.insertBefore(item, addBtn);
  }

  function createTest() {
    alert('Test created!');
  }
</script>
<app-footer></app-footer>
