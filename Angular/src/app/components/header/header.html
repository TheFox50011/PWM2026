<header class="header-body">
  <img class="logo" [src]="logo" alt="Logo">
  <div class="app-name">StudyHub</div>

  <div class="menu-icon" onclick="document.getElementById('mobile-menu-popup').classList.toggle('active')">&#9776;</div>

  <div id="mobile-menu-popup" class="header-popup-menu">
    <!-- Solo navega al perfil si está logueado -->
    <div class="popup-user-profile"
         [routerLink]="isLoggedIn ? '/profile' : null"
         [style.cursor]="isLoggedIn ? 'pointer' : 'default'">
      <div class="popup-avatar">
        <img [src]="profilePicture" alt="avatar"
             style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
      </div>
      <span>{{ userName }}</span>
    </div>

    <nav class="popup-nav">
      <!-- Solo si está logueado -->
      <ng-container *ngIf="isLoggedIn">
        <button routerLink="/notifications">Notifications</button>
        <button routerLink="/favorites">Favorites</button>
        <button routerLink="/settings">Settings</button>
        <button class="logout-btn" (click)="logout()">Logout</button>
      </ng-container>

      <!-- Solo si NO está logueado -->
      <ng-container *ngIf="!isLoggedIn">
        <button routerLink="/login">Login</button>
        <button routerLink="/create-an-account">Register</button>
      </ng-container>
    </nav>
  </div>
</header>
