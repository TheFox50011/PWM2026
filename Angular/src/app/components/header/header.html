<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button *ngIf="isLoggedIn"></ion-menu-button>
    </ion-buttons>
    <ion-title>StudyHub</ion-title>
    <ion-buttons slot="end">
      <div class="avatar-wrapper" (click)="toggleDropdown($event)">
        <ion-avatar style="width:32px;height:32px">
          <img [src]="profilePicture" alt="avatar">
        </ion-avatar>
      </div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- Dropdown manual -->
<div class="user-dropdown" [class.open]="dropdownOpen">
  <ng-container *ngIf="isLoggedIn">
    <div class="dropdown-user" (click)="navigate('/profile')">
      <ion-avatar style="width:36px;height:36px">
        <img [src]="profilePicture" alt="avatar">
      </ion-avatar>
      <strong>{{ userName }}</strong>
    </div>
    <div class="dropdown-divider"></div>
    <button class="dropdown-item" (click)="navigate('/notifications')">🔔 Notifications</button>
    <button class="dropdown-item" (click)="navigate('/favorites')">⭐ Favorites</button>
    <button class="dropdown-item" (click)="navigate('/settings')">⚙️ Settings</button>
    <div class="dropdown-divider"></div>
    <button class="dropdown-item logout" (click)="logout()">🚪 Logout</button>
  </ng-container>
  <ng-container *ngIf="!isLoggedIn">
    <button class="dropdown-item" (click)="navigate('/login')">Login</button>
    <button class="dropdown-item" (click)="navigate('/create-an-account')">Register</button>
  </ng-container>
</div>

<!-- Overlay para cerrar al hacer click fuera -->
<div class="dropdown-overlay" *ngIf="dropdownOpen" (click)="closeDropdown()"></div>
