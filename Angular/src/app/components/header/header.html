<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button *ngIf="isLoggedIn"></ion-menu-button>
    </ion-buttons>
    <ion-title>StudyHub</ion-title>
    <ion-buttons slot="end">
      <ion-button id="user-menu-trigger">
        <ion-avatar style="width:32px;height:32px">
          <img [src]="profilePicture" alt="avatar">
        </ion-avatar>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-popover trigger="user-menu-trigger" side="bottom" alignment="end">
  <ng-template>
    <ion-content>
      <ion-list>
        <ion-item *ngIf="isLoggedIn" [routerLink]="'/profile'">
          <ion-label>{{ userName }}</ion-label>
        </ion-item>
        <ng-container *ngIf="isLoggedIn">
          <ion-item routerLink="/notifications">
            <ion-label>Notifications</ion-label>
          </ion-item>
          <ion-item routerLink="/favorites">
            <ion-label>Favorites</ion-label>
          </ion-item>
          <ion-item routerLink="/settings">
            <ion-label>Settings</ion-label>
          </ion-item>
          <ion-button (click)="logout()" color="danger">
            <ion-label>Logout</ion-label>
          </ion-button>
        </ng-container>
        <ng-container *ngIf="!isLoggedIn">
          <ion-item routerLink="/login">
            <ion-label>Login</ion-label>
          </ion-item>
          <ion-item routerLink="/create-an-account">
            <ion-label>Register</ion-label>
          </ion-item>
        </ng-container>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-popover>
