<body>
  <app-header></app-header>
  <div class="layout-container">

    <app-sidebar></app-sidebar>

    <main class="main-content">
      <div class="status-input">
        <div class="status-input-row">
          <div class="avatar-small">
            <img #profilePictureSmall src="" alt="">
          </div>
          <input #newPostText id="new-post-text" type="text" placeholder="Escribe algo aquí...">

          <div class="add-btn-container">
            <button class="add-btn" (click)="toggleAddMenu($any($event.target), $event)">+</button>

            <div class="add-popup-menu">
              <button id="btn-attach" (click)="triggerFileInput()">📎 Adjuntar archivo</button>
              <button id="btn-publish" (click)="publishPost()">🚀 Publicar</button>
            </div>
          </div>
        </div>

        <input #fileInput type="file" (change)="onFileSelected($event)" style="display: none;">

        <div #attachmentPreview id="attachment-preview" style="display: none;">
          📎 <span #attachmentName></span>
          <button id="btn-remove-attachment" (click)="removeAttachment()" title="Quitar archivo">✖</button>
        </div>
      </div>

      <section class="watchlist-section">
        <h2 routerLink="/mainpage">Watchlist</h2>
        <div #watchlistContainer class="watchlist-cards"></div>
      </section>

      <div id="forums-container"></div>
    </main>

    <aside class="right-sidebar">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input #searchInputEl type="text" placeholder="Buscar" (input)="onSearch($event)">
      </div>

      <div class="tabs">
        <strong>All</strong>
      </div>

      <div class="widget-list">
        <div class="widget-card promoted-card" [routerLink]="['/profile']" [queryParams]="{id: 2}">
          <span>User2</span>
          <div class="study-person"></div>
        </div>
        <div class="widget-card promoted-card1" [routerLink]="['/profile']" [queryParams]="{id: 3}">
          <span>User3</span>
          <div class="study-person1"></div>
        </div>
        <div class="widget-card promoted-card2" [routerLink]="['/profile']" [queryParams]="{id: 4}">
          <span>User4</span>
          <div class="study-person2"></div>
        </div>

        <div class="pagination">
          <span>&lt;</span>
          <span class="page-dot active"></span>
          <span class="page-dot"></span>
          <span class="page-dot"></span>
          <span>&gt;</span>
        </div>
        <section id="forums-section"></section>
      </div>
    </aside>

  </div>
  <app-footer></app-footer>
</body>
