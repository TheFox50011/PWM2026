<app-header></app-header>

<ion-content id="main-content" class="ion-padding">
  <h1 class="ion-text-center" style="color:var(--ion-color-primary);font-size:2rem;font-weight:700;margin-bottom:28px">Create An Account</h1>

  <form [formGroup]="formAccount" (ngSubmit)="handleRegister()" style="max-width:420px;margin:0 auto">
    <ion-list>
      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <ion-input type="email" formControlName="email" placeholder="example@mail.com"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Name</ion-label>
        <ion-input type="text" formControlName="name" placeholder="Name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Surname</ion-label>
        <ion-input type="text" formControlName="surname" placeholder="Surname"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">User</ion-label>
        <ion-input type="text" formControlName="username" placeholder="Username"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Password</ion-label>
        <ion-input type="password" formControlName="password" placeholder="Password (min 8 chars)"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Repeat password</ion-label>
        <ion-input type="password" formControlName="repeatPassword" placeholder="Repeat password"></ion-input>
      </ion-item>
    </ion-list>

    @if (errorMessage) {
      <ion-text color="danger" class="ion-text-center">
        <p>{{errorMessage}}</p>
      </ion-text>
    }

    <div class="ion-text-center ion-margin-top">
      <ion-button type="submit" color="primary" expand="block">Next</ion-button>
    </div>
  </form>
</ion-content>

<app-footer></app-footer>
