<body>
<app-header></app-header>
<main class="notifications-section">
  <div class="left-column">
    <div class="user-header">
      <div>My User</div>
    </div>

    <p class="section-subtitle">Request accounts</p>
    <div class="empty-state-card">
      <span>No pending requests at this time.</span>
    </div>

    <div id="today">
      <p class="section-subtitle">Today</p>
    </div>

    <div id="yesterday">
      <p class="section-subtitle">Yesterday</p>
    </div>

    <div id="last30Days">
      <p class="section-subtitle">Last 30 days</p>
    </div>

    <p class="section-subtitle">Suggestions</p>
    <div class="empty-state-card">
      <span>No suggestions available yet. Follow more people!</span>
    </div>
  </div>

  <div class="right-column">
    <p class="stats-title">Statistics</p>
    <div class="stat-box" id="day-streak">Day Streak</div>
    <div class="stat-box" id="likes">Likes</div>
    <div class="stat-box" id="viewers">Total viewers</div>
  </div>
</main>
<app-footer></app-footer>
</body>
