<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Mockup</title>
    <header style="display: flex; justify-content: space-around; align-items: center; padding: 20px; background-color: #bbb; border: 1px solid #000;">
        <div style="width: 50px; height: 50px; border-radius: 50%; border: 1px solid #333; display: flex; align-items: center; justify-content: center; background-color: #ccc;">
            <strong>Logo</strong>
        </div>

        <div class="app-name">APP NAME</div>

        <div class="menu-icon">&#9776;</div>
    </header>
    <h1 style="display: flex; justify-content: center; align-items: center; font-family: sans-serif; font-weight: bold;">Create Forum</h1>

    <style>
        /* Contenedor principal de la sección central */
        .forum-section {
            background-color: #ffffff; /* Fondo blanco */
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px;
            font-family: Arial, sans-serif;
            color: #333;
            box-sizing: border-box;

            /* Flexbox para dividir en dos columnas */
            display: flex;
            gap: 40px;
        }

        /* --- COLUMNA IZQUIERDA (Títulos y Descripción) --- */
        .left-column {
            flex: 2; /* Ocupa más espacio que la derecha */
            display: flex;
            flex-direction: column;
        }

        .input-label {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
        }

        /* Input con forma de píldora para el título */
        .input-title {
            background-color: #D9D9D9; /* Gris medio */
            border: none;
            border-radius: 25px;
            height: 45px;
            padding: 0 20px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 25px; /* Separación con el siguiente elemento */
        }

        /* Textarea grande para la descripción */
        .input-description {
            background-color: #D9D9D9;
            border: none;
            border-radius: 15px;
            height: 250px;
            padding: 20px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            resize: none; /* Evita que el usuario cambie el tamaño de la caja */
        }

        /* --- COLUMNA DERECHA (Opciones del foro) --- */
        .right-column {
            flex: 1; /* Columna más estrecha */
            display: flex;
            flex-direction: column;
        }

        /* Tarjeta gris que contiene todas las opciones */
        .options-card {
            background-color: #D9D9D9;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .option-category-title {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }

        /* Estilo de los Radio Buttons */
        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #333;
            margin-bottom: 8px;
            cursor: pointer;
        }

        /* Línea separadora horizontal */
        .divider {
            border: none;
            border-top: 1px solid #777; /* Línea gris oscuro */
            margin: 15px 0;
            width: 100%;
        }

        /* Contenedor para el input de "Add tags" con el icono "+" */
        .tags-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .tags-input {
            width: 100%;
            height: 35px;
            border-radius: 20px;
            border: 1px solid #777;
            background-color: #F2F2F2; /* Gris muy clarito/casi blanco */
            padding: 0 35px 0 15px; /* Espacio extra a la derecha para el "+" */
            box-sizing: border-box;
            font-size: 12px;
        }

        .plus-icon {
            position: absolute;
            right: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
        }
    </style>
</head>
<body>

<main class="forum-section">

    <div class="left-column">

        <label class="input-label">Forum title</label>
        <input type="text" class="input-title">

        <label class="input-label">Forum description</label>
        <textarea class="input-description"></textarea>

    </div>

    <div class="right-column">

        <label class="input-label">Forum options</label>

        <div class="options-card">

            <div class="option-category-title">Option category</div>
            <label class="radio-label">
                <input type="radio" name="category1"> Option 1
            </label>
            <label class="radio-label">
                <input type="radio" name="category1"> Option 2
            </label>

            <hr class="divider">

            <div class="option-category-title">Option category</div>
            <label class="radio-label">
                <input type="radio" name="category2"> Option 1
            </label>
            <label class="radio-label">
                <input type="radio" name="category2"> Option 2
            </label>

            <hr class="divider">

            <div class="tags-input-wrapper">
                <input type="text" class="tags-input" placeholder="Add tags">
                <span class="plus-icon">+</span>
            </div>

        </div>

    </div>

</main>
