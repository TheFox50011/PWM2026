<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HomePage</title>
    <style>
        /* Aquí damos estilo a la etiqueta header */
        header {
            font-weight: bold;  /* Texto en negrita */
            font-size: 24px;    /* Texto más grande (puedes subir a 30px si quieres más) */
            font-family: sans-serif; /* Opcional: para que se vea más limpio */
            margin-bottom: 10px; /* Un poco de separación con el texto de abajo */
        }

        .white-rectangle {
            width: 300px;
            height: 100px;
        }
    </style>
</head>
<body>

<header>Web page name</header>

<p>
    <textarea class="white-rectangle" readonly>Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s.</textarea>
</p>

<p><input type="submit" value="Login"></p>
<p><input type="submit" value="Create an Account"></p>

</body>
</html>
