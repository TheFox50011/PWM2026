<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites</title>
    <link rel="stylesheet" href="../css/components/Header.css">
    <link rel="stylesheet" href="../css/components/Footer.css">
    <link rel="stylesheet" href="../css/components/Post.css">
    <link rel="stylesheet" href="../css/Favorites.css">
    <script src="../javascript/xlu-include-file.js"></script>
    <script src="../javascript/load_favorite_posts.js"></script>
</head>
<body>
<header xlu-include-file="components/Header.html"></header>
<div class="header-group">
    <h1>Favorites</h1>
    <div class="options-container">
        <select name="Display options" id="display-options">
            <option value="list">Display options</option>
            <option value="small">Small Icons</option>
            <option value="medium">Medium Icons</option>
            <option value="large">Large Icons</option>
        </select>
    </div>
</div>

<section id="favorite-posts">
    <div class="post-card">
        <span class="star-icon">&#9734;</span>
        <p class="post-title">Post 1</p>
    </div>
    <div class="post-card">
        <span class="star-icon">&#9734;</span>
        <p class="post-title">Post 2</p>
    </div>
    <div class="post-card">
        <span class="star-icon">&#9734;</span>
        <p class="post-title">Post 3</p>
    </div>
    <div class="post-card">
        <span class="star-icon">&#9734;</span>
        <p class="post-title">Post 4</p>
    </div>
</section>
<footer xlu-include-file="components/Footer.html"></footer>
</body>
<script>
    xLuIncludeFile()
        .then(()=>loadFavoritePosts(1))
</script>
</html>
