<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link rel="stylesheet" href="../css/Notifications.css">
    <link rel="stylesheet" href="../css/components/Header.css">
    <link rel="stylesheet" href="../css/components/Footer.css">
    <script src="../javascript/xlu-include-file.js"></script>
</head>
<body>

<header xlu-include-file="components/Header.html">Pepe</header>
<main class="notifications-section">
    <div class="left-column">
        <div class="user-header">
            <div>My User</div>
        </div>

        <p class="section-subtitle">Request accounts</p>
        <div class="empty-state-card">
            <span>No pending requests at this time.</span>
        </div>

        <p class="section-subtitle">Today</p>
        <div class="noti-card">
            <span>User has sent you a follow request.</span>
            <div class="btn-group">
                <button class="btn-action btn-accept">Accept</button>
                <button class="btn-action btn-deny">Deny</button>
            </div>
        </div>

        <p class="section-subtitle">Yesterday</p>
        <div class="noti-card">
            <span>User likes your file.</span>
        </div>

        <p class="section-subtitle">Last 30 days</p>
        <div class="noti-card">
            <span>User comment on your file.</span>
        </div>

        <p class="section-subtitle">Suggestions</p>
        <div class="empty-state-card">
            <span>No suggestions available yet. Follow more people!</span>
        </div>
    </div>

    <div class="right-column">
        <p class="stats-title">Statistics</p>
        <div class="stat-box">Day Streak</div>
        <div class="stat-box">Likes</div>
        <div class="stat-box">Total viewers</div>
    </div>
</main>

<footer xlu-include-file="components/Footer.html"></footer>
<script>
    xLuIncludeFile()
</script>
</body>
</html>
