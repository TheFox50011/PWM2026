<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Notifications - HTML Puro</title>
</head>
<body bgcolor="#ffffff" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0">


<br>

<table width="1000" border="0" align="center" cellpadding="0" cellspacing="0">
    <tr>
        <td width="700" valign="top" style="border-right: 2px solid #E6E6E6; padding-right: 30px;">

            <table width="100%" border="0" cellspacing="0" cellpadding="10">
                <tr>
                    <td width="30"><font size="5"><strong>&#8592;</strong></font></td>
                    <td><font face="Arial" size="3"><strong>My User</strong></font></td>
                </tr>
            </table>

            <br>

            <font face="Arial" size="2" color="#555"><strong>Request accounts</strong></font>
            <table width="100%" border="1" cellspacing="0" cellpadding="15" bgcolor="#FAFAFA" style="border: 1px dashed #CCC; border-radius: 10px; margin-top: 8px;">
                <tr>
                    <td align="center"><font face="Arial" size="2" color="#999">No pending requests at this time.</font></td>
                </tr>
            </table>

            <br>

            <font face="Arial" size="2" color="#555"><strong>Today</strong></font>
            <table width="100%" border="0" cellspacing="0" cellpadding="15" bgcolor="#F2F2F2" style="border-radius: 10px; margin-top: 8px;">
                <tr>
                    <td><font face="Arial" size="2"><strong>User has sent you a follow request.</strong></font></td>
                    <td align="right">
                        <button style="border: 1; border-radius: 15px; padding: 6px 15px; font-weight: bold; cursor: pointer;">Accept</button>
                        <button style="border: 1; border-radius: 15px; padding: 6px 15px; font-weight: bold; cursor: pointer;">Deny</button>
                    </td>
                </tr>
            </table>

            <br>

            <font face="Arial" size="2" color="#555"><strong>Yesterday</strong></font>
            <table width="100%" border="0" cellspacing="0" cellpadding="15" bgcolor="#F2F2F2" style="border-radius: 10px; margin-top: 8px;">
                <tr>
                    <td><font face="Arial" size="2"><strong>User likes your file.</strong></font></td>
                </tr>
            </table>

            <br>

            <font face="Arial" size="2" color="#555"><strong>Last 30 days</strong></font>
            <table width="100%" border="0" cellspacing="0" cellpadding="15" bgcolor="#F2F2F2" style="border-radius: 10px; margin-top: 8px;">
                <tr>
                    <td><font face="Arial" size="2"><strong>User comment on your file.</strong></font></td>
                </tr>
            </table>

            <br>

            <font face="Arial" size="2" color="#555"><strong>Suggestions</strong></font>
            <table width="100%" border="1" cellspacing="0" cellpadding="15" bgcolor="#FAFAFA" style="border: 1px dashed #CCC; border-radius: 10px; margin-top: 8px;">
                <tr>
                    <td align="center"><font face="Arial" size="2" color="#999">No suggestions available yet. Follow more people!</font></td>
                </tr>
            </table>
        </td>

        <td width="30">&nbsp;</td>

        <td width="270" valign="top">
            <font face="Arial" size="2" color="#555"><strong>Statistics</strong></font>
            <br><br>

            <table width="100%" border="1" cellspacing="0" cellpadding="0">
                <tr>
                    <td height="120" align="center" valign="top" style="border-radius: 0px; padding-top: 15px;">
                        <font face="Arial" size="2"><strong>Day Streak</strong></font>
                    </td>
                </tr>
                <tr>
                    <td height="120" align="center" valign="top" style="border-radius: 0px; padding-top: 15px;">
                        <font face="Arial" size="2"><strong>Likes</strong></font>
                    </td>
                </tr>
                <tr>
                    <td height="120" align="center" valign="top" style="border-radius: 0px; padding-top: 15px;">
                        <font face="Arial" size="2"><strong>Total viewers</strong></font>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>


</body>
</html>
