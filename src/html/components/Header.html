<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Estructura Limpia</title>
    <style>
        header{
            position: flex;
            justify-content: space-between;
            align-items: center;

            padding: 10px 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .logo{
            font: bold;
            font-size: 19px;
        }
        .app_name{
            font: bold;
            font-size: 18px;
            font-weight: 600;
        }
        .menu_icon{
            font-size: 24px;
            cursor: pointer;
        }
    </style>
    </head>
<body>

<header>
    <div class="logo">LOGO</div>

    <div class="app-name">APP NAME</div>

    <div class="menu-icon">&#9776;</div>
</header>

</body>
</html>
