<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="../css/components/Header.css">
    <link rel="stylesheet" href="../css/components/Footer.css">
    <link rel="stylesheet" href="../css/components/dark_mode.css">
    <link rel="stylesheet" href="../css/Profile.css">
    <script src="../javascript/dark_mode.js"></script>
    <script src="../javascript/xlu-include-file.js"></script>
    <script src="../javascript/load_user.js"></script>
    <script src="../javascript/update_header_avatar.js"></script>
</head>
<body>
<header xlu-include-file="components/Header.html"></header>

<main class="profile-container">
    <section id="profile-header">
        <div class="profile-photo-container">
            <div class="photo-placeholder">
                <img src="" id="profile-picture">
            </div>
        </div>

        <div class="profile-info-grid">
            <div class="info-group">
                <p class="label">Name</p>
                <div class="data-box" id="profile-name">Cargando...</div>
            </div>
            <div class="info-group">
                <p class="label">Followers</p>
                <div class="data-box" id="profile-followers">...</div>
            </div>
            <div class="info-group">
                <p class="label">Following</p>
                <div class="data-box" id="profile-following">...</div>
            </div>
            <div class="info-group">
                <p class="label">Email</p>
                <div class="data-box" id = "profile-email"></div>
            </div>
        </div>
    </section>

    <section class="profile-details">
        <div class="biography-section">
            <p class="label">Biography</p>
            <div class="bio-box" id="profile-bio"></div>
        </div>

        <div class="linktree-section">
            <p class="label">Linktree</p>
            <div class="links-container">
                <div class="links-container" id="profile-links">
                </div>
            </div>
        </div>
    </section>


    <hr class="section-divider">

    <h2 class="shared-title">Shared files</h2>
    <section id="shared-files">
        <div class="shared-item file-box">
            <a href="#" class="file-link">File name.pdf</a>
        </div>

        <div class="shared-item test-box">
            <p class="test-title">Test title</p>
            <button class="btn-start" onclick="window.location.href='../html/DoTest.html'">Start</button>
        </div>
    </section>
</main>
<footer xlu-include-file="components/Footer.html"></footer>
<script>
    loadUserProfile()
        .then(xLuIncludeFile)
</script>
</body>

</html>
