<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Edit Profile</TITLE>
    <link rel="stylesheet" href="../css/components/Header.css">
    <link rel="stylesheet" href="../css/components/Footer.css">
    <script src="../javascript/xlu-include-file.js"></script>
</head>
<body>
<header xlu-include-file="components/Header.html"></header>
<main>
<input type="image" name="profile-picture">
<p>Name:</p>
<input type="text" name="name" placeholder="example" required>
<p>Biography:</p>
<input type="text" name="biography" placeholder="Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor.">
<p>Location:</p>
<input type="text" name="location" placeholder="example">
<p>Email:</p>
<input type="email" name="email" placeholder="example@mail.com">
<p>Link Social Media:</p>
<input type="url" name="url" placeholder="http://example.com">
</main>
<footer xlu-include-file="components/Footer.html"></footer>
<script>
    xLuIncludeFile()
</script>
</body>
</html>
