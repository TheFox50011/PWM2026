<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="../css/EditProfile.css">
    <link rel="stylesheet" href="../css/components/Header.css">
    <link rel="stylesheet" href="../css/components/Footer.css">
    <script src="../javascript/xlu-include-file.js"></script>
    <script src="../javascript/save_profile.js"></script>
    <script src="../javascript/load_profile_to_edit.js"></script>
</head>
<body>
<header xlu-include-file="components/Header.html"></header>
<main class="container">
    <div class="profile-avatar">
        <div class="avatar-circle">
            <span class="user-icon">&#128100;</span>
        </div>
        <button class="edit-photo-btn">&#9998;</button>
    </div>

    <section class="edit-card">
        <div class="input-group">
            <label>Name:</label>
            <input type="text" name="name" placeholder="example" required>
        </div>

        <div class="input-group">
            <label>Biography:</label>
            <textarea name="biography" placeholder="lorem ipsum"></textarea>
        </div>

        <div class="input-group">
            <label>Location:</label>
            <input type="text" name="location" placeholder="example">
        </div>

        <div class="input-group">
            <label>Email:</label>
            <input type="email" name="email" placeholder="example@mail.com">
        </div>

        <div class="input-group">
            <label>Link Social Profile:</label>
            <input type="url" name="url" placeholder="example">
        </div>
        <div class="button-container">
            <a href="#" class="no-decor">
                <button class="btn-save" onclick="window.location.href='Profile.html'">Save</button>
            </a>
        </div>
    </section>
</main>
<footer xlu-include-file="components/Footer.html"></footer>
<script>
    xLuIncludeFile()
    load_profile_to_edit(1)
</script>
</body>
</html>
