<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>

    <link rel="stylesheet" href="../css/components/Header.css">
    <link rel="stylesheet" href="../css/components/Footer.css">
    <link rel="stylesheet" href="../css/components/dark_mode.css">
    <link rel="stylesheet" href="../css/CreateForum.css">
    <script src="../javascript/dark_mode.js"></script>
    <script src="../javascript/xlu-include-file.js"></script>
    <script src="../javascript/update_header_avatar.js"></script>
    <script src="../javascript/add_tag.js"></script>
    <script src="../javascript/save_forum.js"></script>
</head>
<body>

<header xlu-include-file="components/Header.html"></header>

<h1 class="main-title">Create Forum</h1>
<form action='Mainpage.html' onsubmit="saveForum()">
<main class="forum-section">
    <div class="left-column">
        <label class="input-label">Forum title</label>
        <input type="text" class="input-title" required>

        <label class="input-label">Forum description</label>
        <textarea class="input-description" required></textarea>
    </div>

    <div class="right-column">
        <label class="input-label">Forum options</label>

        <div class="options-card">
            <div class="option-category-title">Option category</div>
            <label class="radio-label">
                <input type="radio" name="category1"> Option 1
            </label>
            <label class="radio-label">
                <input type="radio" name="category1"> Option 2
            </label>

            <hr class="divider">

            <div class="option-category-title">Option category</div>
            <label class="radio-label">
                <input type="radio" name="category2"> Option 1
            </label>
            <label class="radio-label">
                <input type="radio" name="category2"> Option 2
            </label>

            <hr class="divider">

            <div class="tags-area"></div>
            <div class="tags-input-wrapper">
                <input type="text" class="tags-input" placeholder="Add tags" id="tags-input">
                <input type="button" class="plus-icon" value="+" onclick=add_tag()>
            </div>
        </div>
    </div>
</main>
    <button type="submit" class="create-button">Create</button>
</form>
<footer xlu-include-file="components/Footer.html"></footer>
<script>
    xLuIncludeFile()
</script>
</body>
</html>
