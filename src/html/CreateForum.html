<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Mockup</title>
    <link rel="stylesheet" href="../css/CreateForum.css">
</head>
<body>

<header class="main-header">
    <div class="logo-circle">
        <strong>Logo</strong>
    </div>
    <div class="app-name">APP NAME</div>
    <div class="menu-icon">&#9776;</div>
</header>

<h1 class="main-title">Create Forum</h1>

<main class="forum-section">
    <div class="left-column">
        <label class="input-label">Forum title</label>
        <input type="text" class="input-title">

        <label class="input-label">Forum description</label>
        <textarea class="input-description"></textarea>
    </div>

    <div class="right-column">
        <label class="input-label">Forum options</label>

        <div class="options-card">
            <div class="option-category-title">Option category</div>
            <label class="radio-label">
                <input type="radio" name="category1"> Option 1
            </label>
            <label class="radio-label">
                <input type="radio" name="category1"> Option 2
            </label>

            <hr class="divider">

            <div class="option-category-title">Option category</div>
            <label class="radio-label">
                <input type="radio" name="category2"> Option 1
            </label>
            <label class="radio-label">
                <input type="radio" name="category2"> Option 2
            </label>

            <hr class="divider">

            <div class="tags-input-wrapper">
                <input type="text" class="tags-input" placeholder="Add tags">
                <span class="plus-icon">+</span>
            </div>
        </div>
    </div>
</main>

<footer class="main-footer">
    <nav class="footer-nav">
        <a href="https://github.com/TheFox50011/PWM2026">Link GitHub</a>
        <a href="https://www.figma.com/design/...">Link Figma</a>
        <a href="#">Home</a>
        <a href="#">About Us</a>
    </nav>

    <div class="logo-circle-large">
        <strong>Logo</strong>
    </div>

    <nav class="footer-nav">
        <a href="#">Link Email</a>
        <a href="#">Link Phone</a>
        <a href="#">Our Team</a>
    </nav>
</footer>

</body>
</html>
