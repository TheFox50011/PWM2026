<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Create Forum</title>
</head>
<body marginheight="0" marginwidth="0" topmargin="0" leftmargin="0">


<center>
    <br>
    <font face="sans-serif" size="6"><strong>Create Forum</strong></font>
    <br><br>
</center>

<center>
    <table width="1000" border="0" cellspacing="0" cellpadding="20">
        <tr>
            <td width="650" valign="top">
                <font face="Arial" size="2">Forum title</font><br>
                <input type="text" style="width: 100%; height: 40px; border: 1px solid #777; padding: 10px;">

                <br><br>

                <font face="Arial" size="2">Forum description</font><br>
                <textarea style="width: 100%; height: 250px; border: 1px solid #777; padding: 10px; resize: none;"></textarea>
            </td>

            <td width="350" valign="top">
                <font face="Arial" size="2">Forum options</font><br>
                <table width="100%" border="1" cellspacing="0" cellpadding="20" >
                    <tr>
                        <td>
                            <font face="Arial" size="2"><strong>Option category</strong></font><br>
                            <input type="radio" name="cat1"> <font face="Arial" size="2">Option 1</font><br>
                            <input type="radio" name="cat1"> <font face="Arial" size="2">Option 2</font>

                            <hr color="#777777">

                            <font face="Arial" size="2"><strong>Option category</strong></font><br>
                            <input type="radio" name="cat2"> <font face="Arial" size="2">Option 1</font><br>
                            <input type="radio" name="cat2"> <font face="Arial" size="2">Option 2</font>

                            <hr color="#777777">

                            <table width="100%" border="1" cellspacing="0" cellpadding="5" bordercolor="#777">
                                <tr>
                                    <td>
                                        <input type="text" placeholder="Add tags" style="width: 100%; height: 30px; border: none; background: transparent; padding-left: 10px; font-family: Arial;">
                                    <td width="20" align="center"><strong>+</strong></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</center>


</body>
</html>
