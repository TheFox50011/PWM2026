<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/Login.css">
    <link rel="stylesheet" href="../css/components/Header.css">
    <link rel="stylesheet" href="../css/components/Footer.css">
    <link rel="stylesheet" href="../css/components/dark_mode.css">
    <script src="../javascript/dark_mode.js"></script>
    <script src="../javascript/xlu-include-file.js"></script>
</head>
<body>

<header xlu-include-file="components/Header.html"></header>

<main class="login-container">
    <h1 class="login-title">Login</h1>

    <form class="form-wrapper" onsubmit="handleLogin(event)">

        <div class="input-group">
            <p class="label">User:</p>
            <input type="text" id="login-username" class="main-input" placeholder="User" required>
        </div>

        <div class="input-group">
            <p class="label">Password:</p>
            <input type="password" id="login-password" class="main-input" placeholder="Password" required>
        </div>

        <div class="button-container">
            <button type="submit" class="login-btn">Login</button>
        </div>

        <div class="helper-links">
            <p><a href="ForgotYourPassword.html">Forgot your password?</a></p>
            <p><a href="CreateAnAccount.html">Register</a></p>
        </div>

    </form>
</main>

<footer xlu-include-file="components/Footer.html"></footer>

<script src="../javascript/login.js"></script>
<script>
    xLuIncludeFile()
</script>
</body>
</html>
