<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/Login.css">
    <link rel="stylesheet" href="../css/components/Header.css">
    <link rel="stylesheet" href="../css/components/Footer.css">
    <script src="../javascript/xlu-include-file.js"></script>
</head>
<body>

<header xlu-include-file="components/Header.html"></header>

<main class="login-container">
    <h1 class="login-title">Login</h1>

    <div class="form-wrapper">
        <div class="input-group">
            <p class="label">User:</p>
            <input type="text" class="main-input" placeholder="User">
        </div>

        <div class="input-group">
            <p class="label">Password:</p>
            <input type="password" class="main-input" placeholder="Password">
        </div>

        <div class="button-container">
            <a href="#" class="no-decor">
                <button class="login-btn"  onclick="window.location.href='Mainpage.html'" >Login</button>
            </a>
        </div>

        <div class="helper-links">
            <p><a href="ForgotYourPassword.html">Forgot your password?</a></p>
            <p><a href="CreateAnAccount.html">Register</a></p>
        </div>
    </div>
</main>

<footer xlu-include-file="components/Footer.html"></footer>
<script>
    xLuIncludeFile()
</script>
</body>
</html>
