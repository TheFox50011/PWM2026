<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Do Test</title>
    <link rel="stylesheet" href="../css/DoTest.css">
</head>
<body>

<div class="test-container">
    <main class="question-area">
        <h2 class="question-text">1. Question example</h2>

        <div class="options-list">
            <div class="option">
                <input type="radio" name="answer" value="1" id="ans1">
                <label for="ans1" class="option-label">Answer A</label>
            </div>
            <div class="option">
                <input type="radio" name="answer" value="2" id="ans2">
                <label for="ans2" class="option-label">Answer B</label>
            </div>
            <div class="option">
                <input type="radio" name="answer" value="3" id="ans3">
                <label for="ans3" class="option-label">Answer C</label>
            </div>
        </div>

        <button type="button" class="next-btn">&#8594;</button>
    </main>

    <aside class="stats-panel">
        <div class="stat-group">
            <p>Correct: <span id="correct">0</span></p>
        </div>
        <div class="stat-group">
            <p>Incorrect: <span id="incorrect">0</span></p>
        </div>
        <div class="stat-group">
            <p>Unanswered: <span id="unanswered">0</span></p>
        </div>
    </aside>
</div>

</body>
</html>
