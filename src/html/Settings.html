<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <link rel="stylesheet" href="../css/Settings.css">
    <link rel="stylesheet" href="../css/components/Header.css">
    <link rel="stylesheet" href="../css/components/Footer.css">
    <script src="../javascript/xlu-include-file.js"></script>
</head>

<body>
<header xlu-include-file="components/Header.html"></header>
<div class="settings">
<aside>
    <section>
        <div class="group">
            <div class="user-icon">&#128100</div>
            <div>User</div>
        </div>
        <input type="button" value="Edit profile" id="editprofile" onclick="window.location.href='profile.html'">
    </section>
    <input type="button" value="Home" id="home" onclick="window.location.href='Mainpage.html'">
    <input type="button" value="Notifications" id="notifications" onclick="window.location.href='Notifications.html'">
    <input type="button" value="Favorites" id="favorites" onclick="window.location.href='Favorites.html'">
    <input type="button" value="Logout" id="logout" onclick="window.location.href='Homepage.html'">
</aside>
<main>
    <p>Change Username</p>
    <input type="text" id="username" name="username" placeholder="Username">
    <p>Change e-mail</p>
    <input type="email" id="email" name="email" placeholder="E-mail">
    <div class="group">
        <label>Night Mode</label>
        <input type="checkbox" id="nightmode" name="nightmode" value="nightmode">
    </div>
    <div class="group">
        <label>Font size</label>
        <input type="number" id="fontsize" name="fontsize" value="fontsize" min="1" max="25" inputmode="numeric">
    </div>
    <input type="button" id="deleteaccount" value="Delete Account">
</main>
</div>
<footer xlu-include-file="components/Footer.html"></footer>
<script>
    xLuIncludeFile()
</script>
</body>
</html>
