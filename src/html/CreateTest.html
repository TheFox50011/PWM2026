<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Creator Wireframe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="main-content">

    <section class="left-column">
        <h2 class="section-title">Test Name</h2>
        <input type="text" class="input-large" value="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Praesent sed.">

        <div class="question-card">
            <label class="card-label">Question</label>
            <input type="text" class="input-pill" value="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Praesent sed.">

            <label class="card-label">Options</label>

            <div class="option-row">
                <span class="circle-bullet"></span>
                <input type="text" class="input-pill" value="Lorem ipsum dolor sit amet, consectetur adipiscing">
                <span class="icon-btn" title="Correcto">&#9745;</span>
            </div>

            <div class="option-row">
                <span class="circle-bullet"></span>
                <input type="text" class="input-pill" value="Lorem ipsum dolor sit amet, consectetur adipiscing">
                <span class="icon-btn" title="Incorrecto">&#9744;</span>
            </div>

            <div class="add-text-btn">
                <strong class="plus-symbol">+</strong>
                <span>Add options</span>
            </div>
        </div>
    </section>

    <aside class="right-column">
        <div class="sidebar-card">
            <h3 class="sidebar-title">Questions</h3>

            <div class="question-item">
                <span>Question 1</span>
                <div class="question-actions">
                    <span class="action-icon" title="Editar">&#9998;</span>
                    <span class="action-icon" title="Eliminar">&#128465;</span>
                </div>
            </div>

            <div class="sidebar-add-btn">
                <strong class="plus-symbol-dark">+</strong>
                <span>Add question</span>
            </div>
        </div>
    </aside>

</main>

</body>
</html>
