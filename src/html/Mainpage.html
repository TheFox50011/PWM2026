<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mainpage</title>
    <link rel="stylesheet" href="../css/components/Header.css">
    <link rel="stylesheet" href="../css/components/Footer.css">
    <link rel="stylesheet" href="../css/components/Post.css">
    <link rel="stylesheet" href="../css/components/Sidebar.css">
    <link rel="stylesheet" href="../css/Mainpage.css">
    <script src="../javascript/xlu-include-file.js"></script>
    <script src="../javascript/load_forum.js"></script>
    <script src="../javascript/load_user.js"></script>
</head>
<body>
<header xlu-include-file="components/Header.html"></header>
<div class="layout-container">

    <aside class="sidebar" xlu-include-file="components/Sidebar.html">

    </aside>

    <main class="main-content">
        <div class="status-input">
            <div class="avatar-small">
                <img src="" id="profile-picture-small">
            </div>
            <input type="text" placeholder="Escribe algo aquí...">
            <button class="add-btn">+</button>
        </div>

        <section class="watchlist-section">
            <h2>Watchlist</h2>
            <div class="watchlist-cards" >
                <div class="card" id="forums-container"></div>
            </div>
        </section>

    </main>

    <aside class="right-sidebar">
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Buscar">
        </div>

        <div class="tabs">
            <button class="active">All</button>
            <button onclick="window.location.href='Profile.html?id=1'">Profile</button>
        </div>

        <div class="widget-list">
            <div class="widget-card promoted-card" onclick="window.location.href='Profile.html?id=2'">
                <span>User2</span>
                <div class="study-person"></div>
            </div>
            <div class="widget-card promoted-card1" onclick="window.location.href='Profile.html?id=3'">
                <span>User3</span>
                <div class="study-person1"></div>
            </div>
            <div class="widget-card promoted-card2" onclick="window.location.href='Profile.html?id=4'">
                <span>User4</span>
                <div class="study-person2"></div>
            </div>

            <div class="pagination">
                <span>&lt;</span>
                <span class="page-dot active"></span>
                <span class="page-dot"></span>
                <span class="page-dot"></span>
                <span>&gt;</span>
            </div>
        </div>
    </aside>

</div>
<footer xlu-include-file="components/Footer.html"></footer>
<script>
    xLuIncludeFile()
        .then(()=>loadUserProfile(1))
        .then(()=>loadForums(new URLSearchParams(window.location.search).get("forum")))
</script>
</body>
</html>
