<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Create An Account</title>
</head>

<body marginheight="0" marginwidth="0" topmargin="0" leftmargin="0">

<center>
    <br>
    <font face="sans-serif" size="6"><strong>Create An Account</strong></font>
    <br><br>
</center>

<center>
    <table width="320" border="0" cellspacing="0" cellpadding="5">
        <tr><td><font face="sans-serif"><strong>Email:</strong></font></td></tr>
        <tr><td><input type="text" placeholder="Email" style="width: 100%; height: 35px; text-align: center;"></td></tr>

        <tr><td><font face="sans-serif"><strong>Name:</strong></font></td></tr>
        <tr><td><input type="text" placeholder="Name" style="width: 100%; height: 35px; text-align: center;"></td></tr>

        <tr><td><font face="sans-serif"><strong>Surname:</strong></font></td></tr>
        <tr><td><input type="text" placeholder="Surname" style="width: 100%; height: 35px; text-align: center;"></td></tr>

        <tr><td><font face="sans-serif"><strong>User:</strong></font></td></tr>
        <tr><td><input type="text" placeholder="Username" style="width: 100%; height: 35px; text-align: center;"></td></tr>

        <tr><td><font face="sans-serif"><strong>Password:</strong></font></td></tr>
        <tr><td><input type="password" placeholder="Password" style="width: 100%; height: 35px; text-align: center;"></td></tr>

        <tr><td><font face="sans-serif"><strong>Repeat password:</strong></font></td></tr>
        <tr><td><input type="password" placeholder="Repeat password" style="width: 100%; height: 35px; text-align: center;"></td></tr>

        <tr>
            <td align="center">
                <br>
                <table border="1" width="120" height="40">

</html>
