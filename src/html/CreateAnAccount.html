<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create An Account</title>
    <link rel="stylesheet" href="../css/CreateAnAccount.css">
    <link rel="stylesheet" href="../css/components/Header.css">
    <link rel="stylesheet" href="../css/components/Footer.css">
    <script src="../javascript/xlu-include-file.js"></script>
</head>
<body>

<header xlu-include-file="components/Header.html"></header>

<h1 class="main-title">Create An Account</h1>

<div class="form-container">
    <div class="input-group">
        <p class="label">Email:</p>
        <input type="text" class="main-input" placeholder="Email">
    </div>

    <div class="input-group">
        <p class="label">Name:</p>
        <input type="text" class="main-input" placeholder="Name">
    </div>

    <div class="input-group">
        <p class="label">Surname:</p>
        <input type="text" class="main-input" placeholder="Surname">
    </div>

    <div class="input-group">
        <p class="label">User:</p>
        <input type="text" class="main-input" placeholder="Username">
    </div>

    <div class="input-group">
        <p class="label">Password:</p>
        <input type="password" class="main-input" placeholder="Password">
    </div>

    <div class="input-group">
        <p class="label">Repeat password:</p>
        <input type="password" class="main-input" placeholder="Repeat password">
    </div>

    <div class="button-container">
        <a href="#" class="no-decor">
            <button class="next-btn" onclick="window.location.href='Login.html'">Next</button>
        </a>
    </div>
</div>

<footer xlu-include-file="components/Footer.html"></footer>
<script>
    xLuIncludeFile()
</script>
</body>
</html>
